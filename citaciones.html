<style>
:root{
  --g1:#2E6730; --g2:#28B955; --lime:#96E85F; --gd:#12341A; --gk:#07120A;
  --y:#F2BE16; --y2:#FAC828; --bk:#0A0A0A; --w:#fff; --no:#E5484D;
  --card:rgba(255,255,255,.06); --line:rgba(255,255,255,.12); --mut:rgba(255,255,255,.62);
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--gk);color:var(--w);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif;font-size:16px;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;
  background:
   radial-gradient(90% 45% at 105% -5%, rgba(40,185,85,.55), transparent 65%),
   radial-gradient(70% 40% at -10% 35%, rgba(150,232,95,.16), transparent 65%),
   radial-gradient(80% 40% at 110% 100%, rgba(242,190,22,.22), transparent 65%),
   linear-gradient(180deg,#123a1c 0%,#0b2312 35%,#07120A 75%)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:calc(var(--sat) + 10px) 16px calc(var(--sab) + 110px)}
header.top{display:flex;align-items:center;gap:12px;padding:6px 0 14px}
.badge{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:900;font-size:17px;
  background:radial-gradient(circle at 30% 25%,var(--g2),var(--g1) 60%,var(--gd));border:3px solid var(--bk);box-shadow:0 0 0 2px var(--y),0 0 22px rgba(150,232,95,.35)}
img.badge{width:46px;height:46px;flex:none;object-fit:contain;border-radius:50%;border:none;background:none;box-shadow:0 0 18px rgba(255,255,255,.28)}
.brand{flex:1;min-width:0}
.brand small{display:block;color:var(--y);font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.brand b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.dot i{width:10px;height:10px;border-radius:50%;background:#8a8a8a;display:block}
.dot.ok i{background:var(--g2);box-shadow:0 0 10px var(--g2)} .dot.sync i{background:var(--y);animation:pl 1s infinite} .dot.err i{background:var(--no)}
@keyframes pl{50%{opacity:.3}}
h1{font-size:34px;line-height:1.05;margin:4px 0 16px;font-weight:900;letter-spacing:-.02em}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--y2),var(--lime));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:22px 0 10px;font-weight:800}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px;background:rgba(242,190,22,.15);color:var(--y2);border:1px solid rgba(242,190,22,.35)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.card+.card{margin-top:10px}
.cit{display:block;text-decoration:none;position:relative;overflow:hidden}
.cit .t{font-weight:900;font-size:18px;margin:6px 0 2px}
.cit .s{color:var(--mut);font-size:14px}
.cit .bar{height:8px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden;display:flex;margin-top:12px}
.cit .bar span{display:block;height:100%}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.mut{color:var(--mut)} .sm{font-size:13px}
.btn{min-height:50px;border-radius:14px;border:none;padding:0 18px;font-weight:800;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none;width:100%}
.btn.p{background:linear-gradient(135deg,var(--y2),var(--y));color:var(--bk);box-shadow:0 8px 24px rgba(242,190,22,.25)}
.btn.g{background:linear-gradient(135deg,var(--g2),var(--g1));color:#fff;box-shadow:0 8px 24px rgba(40,185,85,.3)}
.btn.o{background:var(--card);border:1px solid var(--line);color:#fff}
.btn.d{background:rgba(229,72,77,.12);border:1px solid rgba(229,72,77,.4);color:#ff8f92}
.btn.sm2{min-height:44px;font-size:15px;width:auto;padding:0 14px}
.btn[disabled],.btn.off{opacity:.45;pointer-events:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 84px);width:min(528px,calc(100% - 32px));z-index:20}
nav.tab{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;background:rgba(7,18,10,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 8px calc(var(--sab) + 6px)}
nav.tab a{flex:1;max-width:180px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--mut);font-size:12px;font-weight:700;border-radius:12px}
nav.tab a svg{width:24px;height:24px}
nav.tab a.on{color:var(--y2)}
label.f{display:block;margin:12px 0 0}
label.f span{display:block;font-size:13px;font-weight:800;color:var(--mut);margin:0 0 6px;text-transform:uppercase;letter-spacing:.05em}
input.i,select.i,textarea.i{width:100%;min-height:50px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.35);padding:12px 14px;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
textarea.i{min-height:90px;resize:vertical}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--lime);box-shadow:0 0 0 3px rgba(150,232,95,.2)}
select.i{background-image:linear-gradient(45deg,transparent 50%,#fff 50%),linear-gradient(135deg,#fff 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 14px) 22px;background-size:6px 6px;background-repeat:no-repeat}
input[type=date].i,input[type=time].i{display:block}
.seg{display:flex;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:44px;border:none;border-radius:10px;background:transparent;font-weight:800;color:var(--mut);cursor:pointer}
.seg button.on{background:linear-gradient(135deg,var(--g2),var(--g1));color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.3);font-weight:700;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:15px}
.chip.on{background:rgba(40,185,85,.22);border-color:var(--g2);color:#fff}
.chip .ck{width:20px;height:20px;border-radius:6px;border:2px solid rgba(255,255,255,.4);display:grid;place-items:center;font-size:13px}
.chip.on .ck{background:var(--g2);border-color:var(--g2)}
.scroll-x{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}
.scroll-x .chip{flex:none}
.info{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.info:last-child{border-bottom:none}
.info .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:rgba(150,232,95,.12);font-size:18px;flex:none}
.info small{display:block;font-size:11px;font-weight:800;color:var(--lime);letter-spacing:.08em;text-transform:uppercase}
.info b{display:block;font-size:16px;word-break:break-word}
.stats{display:flex;align-items:center;gap:14px}
.donut{position:relative;width:96px;height:96px;flex:none}
.donut svg{transform:rotate(-90deg)}
.donut div{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.donut b{font-size:22px;font-weight:900}
.donut small{font-size:10px;color:var(--mut);display:block;margin-top:2px}
.nums{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.nums b{display:block;font-size:30px;font-weight:900;line-height:1}
.nums span{font-size:12px;color:var(--mut);font-weight:700}
.c-si{color:var(--g2)} .c-no{color:var(--no)} .c-pe{color:#cfcfcf}
.tabs3{display:flex;gap:6px;margin:14px 0 8px}
.tabs3 button{flex:1;min-height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.3);font-weight:800;font-size:14px;cursor:pointer;color:var(--mut)}
.tabs3 button.on{color:#fff;border-color:var(--y);background:rgba(242,190,22,.12)}
.pl{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.pl:last-child{border-bottom:none}
.pl .nm{flex:1;min-width:0}
.pl .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .nm small{display:block;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{min-width:44px;height:44px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;font-size:18px;background:rgba(0,0,0,.3);cursor:pointer;flex:none}
.st.si{background:rgba(40,185,85,.25);border-color:var(--g2)} .st.no{background:rgba(229,72,77,.18);border-color:var(--no)}
.wa{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(40,185,85,.15);border:1px solid rgba(40,185,85,.4);flex:none;text-decoration:none}
.wa svg{width:22px;height:22px;fill:var(--g2)}
.wa.off{opacity:.3;pointer-events:none}
.sent{font-size:11px;font-weight:800;color:var(--lime)}
.prog{height:10px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden;margin:10px 0 4px}
.prog span{display:block;height:100%;background:linear-gradient(90deg,var(--g2),var(--lime));border-radius:9px;transition:width .3s}
.empty{text-align:center;padding:30px 16px}
.empty .big{font-size:46px}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;text-decoration:none;color:var(--mut);font-weight:700;margin-bottom:4px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fi .15s}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:linear-gradient(180deg,#143d1f,#0a1c0f);border:1px solid var(--line);border-bottom:none;border-radius:22px 22px 0 0;padding:18px 16px calc(var(--sab) + 18px);animation:su .2s}
.sheet h3{margin:0 0 6px;font-size:22px;font-weight:900}
@keyframes su{from{transform:translateY(40px);opacity:0}} @keyframes fi{from{opacity:0}}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--sat) + 12px);z-index:80;background:#fff;color:var(--bk);padding:12px 16px;border-radius:14px;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:calc(100% - 32px);font-size:15px;animation:fi .2s}
.cmt{font-size:13px;color:var(--y2);margin-top:2px}
.note{font-size:13px;color:var(--mut);line-height:1.4}
code.sql{display:block;white-space:pre;overflow:auto;background:rgba(0,0,0,.45);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:11px;max-height:240px}
/* Página de respuesta para apoderados */
.resp{max-width:480px;margin:0 auto;padding:calc(var(--sat) + 24px) 18px calc(var(--sab) + 30px);text-align:center}
.resp .badge{width:96px;height:96px;margin:0 auto 12px;font-size:32px}
.resp img.badge{width:110px;height:110px;margin:0 auto 12px;display:block}
.resp .club{color:var(--y);font-weight:900;letter-spacing:.08em;text-transform:uppercase;font-size:13px}
.resp h1{font-size:32px;margin:10px 0 16px}
.resp .card{text-align:left}
.big2{min-height:64px;font-size:19px}
.done{font-size:64px;line-height:1;margin:10px 0}
</style>

async function sync() {

    const me = C.session.user.id;

    const remoto = await SB.rest('dl_registros?select=id,tipo,data,deleted,updated_at');
    let perdidos = 0;
    for (const r of remoto) {
      const l = R[r.id];
      if (!l || t(r.updated_at) > t(l.updated_at)) {
        if (l && l.dirty) perdidos++;

    const sube = Object.values(R).filter(x => x.dirty);

      sube.forEach((x, i) => { if (x.updated_at === marca[i]) x.dirty = false; });

/* ---------- mensajes de WhatsApp ---------- */
function titulo(c) {
  if (c.tipo === 'Partido') return 'Partido vs ' + (c.rival || 'por confirmar');
  if (c.tipo === 'Entrenamiento') return 'Entrenamiento';
  return c.titulo || 'Citación';
}
function linkResp(v) {
  let u = location.origin + location.pathname + '?r=' + v.token;
  if (!SUPABASE_URL) u += '&k=' + b64u(SB.url() + '|' + SB.key());
  return u;
}
function mensaje(rec, v, recordatorio) {
  const c = rec.data, L = [];
  L.push(recordatorio ? '⏰ *Recordatorio de citación*' : '⚽ *' + CLUB + '*', '');
  L.push(`Hola${v.apoderado ? ' ' + v.apoderado : ''} 👋 *${v.nombre}* está citado/a:`);
  L.push(`🏟️ *${titulo(c)}*`);
  if (c.cat) L.push('👥 ' + c.cat);
  L.push('📅 ' + cap(fmtFecha(c.fecha)));
  if (c.hora) L.push('⏰ ' + c.hora + ' hrs' + (c.presentacion ? ' (presentarse ' + c.presentacion + ')' : ''));
  if (c.lugar) L.push('📍 ' + c.lugar);
  if (c.mapa) L.push('🗺️ ' + c.mapa);
  if (c.notas) L.push('📝 ' + c.notas);
  L.push('');
  if (linksActivos(rec)) L.push('Confirma con un toque aquí 👇', linkResp(v));
  else L.push('Por favor responde *SÍ* o *NO* a este mensaje.');
  if (CFG().firma) L.push('', CFG().firma);
  return L.join('\n');
}
const waURL = (rec, v, rec2) => 'https://wa.me/' + telWA(v.tel) + '?text=' + encodeURIComponent(mensaje(rec, v, rec2));

/* ---------- vistas ---------- */
let ui = { tab: 'si', plCat: null };
function ruta() { const h = location.hash.replace(/^#\/?/, '').split('/'); return { v: h[0] || 'inicio', id: h[1] }; }
const go = h => { location.hash = h; };
function escudo(cls = 'badge') { return `<img class="${cls}" src="${CFG().escudo || ESCUDO}" alt="Escudo">`; }
function head() {
  return `<header class="top">${escudo()}<div class="brand"><small>Citaciones</small><b>${CLUB}</b></div>
  <a id="dot" class="dot ${dotState}" href="#/ajustes" aria-label="Estado de sincronización"><i></i></a></header>`;
}
function nav(v) {
  const it = (h, ic, tx) => `<a href="#/${h}" class="${v === h ? 'on' : ''}">${ic}<span>${tx}</span></a>`;
  return `<nav class="tab">
   ${it('inicio', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>', 'Citaciones')}
   ${it('plantel', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17.5" cy="9" r="2.5"/><path d="M16 14.5a5 5 0 0 1 6 5"/></svg>', 'Plantel')}
   ${it('ajustes', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>', 'Ajustes')}
  </nav>`;
}
function cuenta(c) {
  const k = { si: 0, no: 0, pendiente: 0 };
  c.data.convocados.forEach(v => k[v.estado] = (k[v.estado] || 0) + 1);
  const n = c.data.convocados.length, resp = k.si + k.no;
  return { ...k, n, resp, pct: n ? Math.round(resp / n * 100) : 0, env: c.data.convocados.filter(v => v.enviado).length };
}
function donut(pct) {
  const r = 40, L = 2 * Math.PI * r;
  return `<div class="donut"><svg width="96" height="96" viewBox="0 0 96 96"><defs><linearGradient id="gd" x1="0" x2="1"><stop offset="0" stop-color="#28B955"/><stop offset="1" stop-color="#96E85F"/></linearGradient></defs>
  <circle cx="48" cy="48" r="${r}" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="10"/>
  <circle cx="48" cy="48" r="${r}" fill="none" stroke="url(#gd)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${L * pct / 100} ${L}"/></svg>
  <div><span><b>${pct}%</b><small>respondió</small></span></div></div>`;
}
function statsHTML(c) {
  const k = cuenta(c);
  return `<div class="stats">${donut(k.pct)}<div class="nums">
   <div><b class="c-si">${k.si}</b><span>Asistirán</span></div>
   <div><b class="c-no">${k.no}</b><span>No asistirán</span></div>
   <div><b class="c-pe">${k.pendiente}</b><span>Sin respuesta</span></div></div></div>`;
}
function citCard(c) {
  const k = cuenta(c), d = c.data;
  const w = x => k.n ? (x / k.n * 100) : 0;
  return `<a class="card cit" href="#/cit/${c.id}">
   <div class="row"><span class="pill">${esc(d.tipo)}${d.cat ? ' · ' + esc(d.cat) : ''}</span><span class="sp"></span><span class="sm mut">${k.env}/${k.n} enviados</span></div>
   <div class="t">${esc(titulo(d))}</div>
   <div class="s">${cap(fmtFecha(d.fecha))}${d.hora ? ' · ' + esc(d.hora) + ' hrs' : ''}${d.lugar ? ' · ' + esc(d.lugar) : ''}</div>
   <div class="bar"><span style="width:${w(k.si)}%;background:var(--g2)"></span><span style="width:${w(k.no)}%;background:var(--no)"></span></div>
   <div class="row sm" style="margin-top:6px"><span class="c-si">✓ ${k.si}</span><span class="c-no">✕ ${k.no}</span><span class="mut">• ${k.pendiente} sin respuesta</span></div>
  </a>`;
}
function vInicio() {
  const hoy = hoyISO();
  const all = cits().sort((a, b) => (a.data.fecha + a.data.hora).localeCompare(b.data.fecha + b.data.hora));
  const prox = all.filter(c => c.data.fecha >= hoy), ant = all.filter(c => c.data.fecha < hoy).reverse();
  let h = head() + `<h1>Mis <em>citaciones</em>.</h1>`;
  if (!all.length) h += `<div class="card empty"><div class="big">⚽</div><p><b>Aún no hay citaciones.</b></p>
     <p class="note">${P().jugadores.length ? 'Crea la primera y envíala a cada apoderado por WhatsApp.' : 'Primero agrega a tus jugadores en <b>Plantel</b> (nombre y WhatsApp del apoderado).'}</p>
     ${P().jugadores.length ? '' : '<a class="btn o" href="#/plantel" style="margin-top:8px">Ir a Plantel</a>'}</div>`;
  if (prox.length) {
    const n = prox[0];
    h += `<h2>Próxima</h2><a class="card cit" href="#/cit/${n.id}" style="padding:16px">
      <span class="pill">${esc(n.data.tipo)}${n.data.cat ? ' · ' + esc(n.data.cat) : ''}</span>
      <div class="t" style="font-size:22px">${esc(titulo(n.data))}</div>
      <div class="s" style="margin-bottom:12px">${cap(fmtFecha(n.data.fecha))}${n.data.hora ? ' · ' + esc(n.data.hora) + ' hrs' : ''}</div>${statsHTML(n)}</a>`;
    if (prox.length > 1) h += `<h2>Siguientes</h2>` + prox.slice(1).map(citCard).join('');
  }
  if (ant.length) h += `<h2>Anteriores</h2>` + ant.slice(0, 30).map(citCard).join('');
  h += `<div class="fab"><a class="btn p" href="#/editar">＋ Nueva citación</a></div>` + nav('inicio');
  return h;
}

/* --- crear / editar citación --- */
let draft = null;
function nuevoDraft(id) {
  if (id && R[id]) { const d = JSON.parse(JSON.stringify(R[id].data)); d.sel = d.convocados.map(v => v.jid); return d; }
  const cat = P().categorias[0] || '';
  return { tipo: 'Partido', cat, rival: '', titulo: '', fecha: hoyISO(), hora: '10:00', presentacion: '', lugar: '', mapa: '', notas: '',
    convocados: [], sel: P().jugadores.filter(j => j.cat === cat).map(j => j.id) };
}
function vEditar(id) {
  if (!draft || draft._id !== (id || 'nuevo')) { draft = nuevoDraft(id); draft._id = id || 'nuevo'; }
  const d = draft, cats = P().categorias;
  const lista = P().jugadores.filter(j => d.cat === '*' || j.cat === d.cat).sort((a, b) => a.nombre.localeCompare(b.nombre));
  const selN = d.sel.length;
  return `<a class="back" href="${id ? '#/cit/' + id : '#/inicio'}">‹ Volver</a>
  <h1>${id ? 'Editar' : 'Armo la'} <em>citación</em>.</h1>
  <div class="seg" data-g="tipo">${['Partido', 'Entrenamiento', 'Otro'].map(x => `<button data-act="tipo" data-v="${x}" class="${d.tipo === x ? 'on' : ''}">${x}</button>`).join('')}</div>
  <label class="f"><span>Categoría</span><select class="i" data-f="cat">${cats.map(c => `<option ${d.cat === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}<option value="*" ${d.cat === '*' ? 'selected' : ''}>Todas las categorías</option></select></label>
  ${d.tipo === 'Partido' ? `<label class="f"><span>Rival</span><input class="i" data-f="rival" value="${esc(d.rival)}" placeholder="Ej: Los Aromos FC"></label>` : ''}
  ${d.tipo === 'Otro' ? `<label class="f"><span>Título</span><input class="i" data-f="titulo" value="${esc(d.titulo)}" placeholder="Ej: Foto oficial, Campeonato"></label>` : ''}
  <div class="grid2"><label class="f"><span>Fecha</span><input class="i" type="date" data-f="fecha" value="${esc(d.fecha)}"></label>
   <label class="f"><span>Hora</span><input class="i" type="time" data-f="hora" value="${esc(d.hora)}"></label></div>
  <label class="f"><span>Presentarse (opcional)</span><input class="i" data-f="presentacion" value="${esc(d.presentacion)}" placeholder="Ej: 30 min antes"></label>
  <label class="f"><span>Dónde jugamos</span><input class="i" data-f="lugar" value="${esc(d.lugar)}" placeholder="Ej: Estadio Municipal de Paillaco"></label>
  <label class="f"><span>Link de Google Maps (opcional)</span><input class="i" data-f="mapa" value="${esc(d.mapa)}" placeholder="https://maps.app.goo.gl/…" inputmode="url"></label>
  <label class="f"><span>Notas</span><input class="i" data-f="notas" value="${esc(d.notas)}" placeholder="Ej: Llevar agua y canilleras"></label>
  <h2 class="row"><span>Elijo a quiénes citar</span><span class="sp"></span><span style="color:#fff">${selN} de ${lista.length}</span></h2>
  ${lista.length ? `<div class="row" style="margin-bottom:10px;gap:8px"><button class="btn o sm2" data-act="selAll">Todos</button><button class="btn o sm2" data-act="selNone">Ninguno</button></div>
   <div class="chips">${lista.map(j => `<button class="chip ${d.sel.includes(j.id) ? 'on' : ''}" data-act="selJ" data-id="${j.id}"><span class="ck">${d.sel.includes(j.id) ? '✓' : ''}</span>${esc(j.nombre)}${d.cat === '*' ? ` <span class="mut sm">${esc(j.cat)}</span>` : ''}</button>`).join('')}</div>`
   : `<div class="card note">No hay jugadores en esta categoría. Agrégalos en <a href="#/plantel"><b>Plantel</b></a>.</div>`}
  <div class="fab"><button class="btn p" data-act="guardarCit">${id ? 'Guardar cambios' : 'Guardar citación'}</button></div>`;
}
function guardarCit() {
  const d = draft; if (!d.sel.length) return toast('Elige al menos un jugador.');
  if (!d.fecha) return toast('Falta la fecha.');
  const id = d._id === 'nuevo' ? uid() : d._id;
  const prev = R[id] ? R[id].data.convocados : [];
  const convocados = d.sel.map(jid => {
    const j = P().jugadores.find(x => x.id === jid), p = prev.find(x => x.jid === jid);
    if (p) return Object.assign(p, j ? { nombre: j.nombre, apoderado: j.apoderado, tel: j.tel } : {});
    return { jid, nombre: j.nombre, apoderado: j.apoderado || '', tel: j.tel || '', token: tok(), estado: 'pendiente', comentario: '', enviado: false };
  }).sort((a, b) => a.nombre.localeCompare(b.nombre));
  const data = { tipo: d.tipo, cat: d.cat === '*' ? 'Varias categorías' : d.cat, rival: d.rival.trim(), titulo: d.titulo.trim(), fecha: d.fecha, hora: d.hora,
    presentacion: d.presentacion.trim(), lugar: d.lugar.trim(), mapa: d.mapa.trim(), notas: d.notas.trim(), convocados };
  R[id] = Object.assign(R[id] || { id, tipo: 'citacion' }, { data, deleted: false });
  touch(R[id]); draft = null; schedSync(100);
  toast('Citación guardada ✓'); go('#/cit/' + id);
}

/* --- detalle de citación --- */

   <div class="prog"><span style="width:${k.n ? k.env / k.n * 100 : 0}%"></span></div>
   ${sinTel ? `<p class="note">⚠️ ${sinTel} sin WhatsApp registrado. Agrégalo en Plantel.</p>` : ''}
   ${sig ? `<a class="btn g" style="margin-top:10px" href="${waURL(c, sig)}" target="_blank" rel="noopener" data-act="enviar" data-tk="${sig.token}">${WA_SVG.replace('<svg', '<svg width="22" height="22" fill="#fff"')} Enviar a ${esc(sig.nombre)} (${k.env + 1}/${conTel.length})</a>
      <p class="note" style="text-align:center;margin:8px 0 0">Toca, envía en WhatsApp y vuelve: el botón pasa al siguiente.</p>`

   ${recordar.length ? `<a class="btn o" style="margin-top:10px" href="${waURL(c, recordar[0], true)}" target="_blank" rel="noopener" data-act="recordar" data-tk="${recordar[0].token}">⏰ Recordar a ${esc(recordar[0].nombre)} (${recordar.length} sin responder)</a>` : ''}

     <div class="nm"><b>${esc(v.nombre)}</b><small>${esc(v.apoderado || 'Apoderado')}${v.enviado ? ' · <span class="sent">enviado</span>' : ''}${v.via === 'enlace' ? ' · respondió por enlace' : ''}</small>${v.comentario ? `<div class="cmt">“${esc(v.comentario)}”</div>` : ''}</div>
     <a class="wa ${telWA(v.tel) ? '' : 'off'}" href="${telWA(v.tel) ? waURL(c, v, v.enviado) : '#'}" target="_blank" rel="noopener" data-act="enviar1" data-tk="${v.token}" aria-label="WhatsApp">${WA_SVG}</a>

}
function findV(c, tk) { return c.data.convocados.find(v => v.token === tk); }
function listaTexto(c) {
  const d = c.data, si = d.convocados.filter(v => v.estado === 'si'), no = d.convocados.filter(v => v.estado === 'no'), pe = d.convocados.filter(v => v.estado === 'pendiente');
  const L = [`⚽ *${titulo(d)}*${d.cat ? ' · ' + d.cat : ''}`, `📅 ${cap(fmtFecha(d.fecha))}${d.hora ? ' · ' + d.hora + ' hrs' : ''}`];
  if (d.lugar) L.push('📍 ' + d.lugar);
  L.push('', `✅ *Asisten (${si.length})*`, ...si.map((v, i) => `${i + 1}. ${v.nombre}`));
  if (no.length) L.push('', `❌ *No asisten (${no.length})*`, ...no.map(v => '• ' + v.nombre));
  if (pe.length) L.push('', `⏳ *Sin respuesta (${pe.length})*`, ...pe.map(v => '• ' + v.nombre));
  return L.join('\n');
}

/* --- plantel --- */
function vPlantel() {
  const p = P(); if (!ui.plCat || !p.categorias.includes(ui.plCat)) ui.plCat = p.categorias[0];
  const js = p.jugadores.filter(j => j.cat === ui.plCat).sort((a, b) => a.nombre.localeCompare(b.nombre));
  return head() + `<h1>Mi <em>plantel</em>.</h1>
  <div class="scroll-x">${p.categorias.map(c => `<button class="chip ${c === ui.plCat ? 'on' : ''}" data-act="plCat" data-v="${esc(c)}">${esc(c)} <span class="mut sm">${p.jugadores.filter(j => j.cat === c).length}</span></button>`).join('')}
   <button class="chip" data-act="addCat">＋ Categoría</button></div>
  <div class="card" style="margin-top:12px">${js.length ? js.map(j => `<div class="pl">
    <div class="nm"><b>${esc(j.nombre)}</b><small>${esc(j.apoderado || 'Sin apoderado')} · ${j.tel ? esc(j.tel) : '<span class="c-no">sin WhatsApp</span>'}</small></div>
    <button class="st" data-act="editJ" data-id="${j.id}" aria-label="Editar">✏️</button></div>`).join('')
    : `<div class="empty"><div class="big">👟</div><p class="note">Sin jugadores en ${esc(ui.plCat || 'esta categoría')}.</p></div>`}</div>
  <div class="grid2" style="margin-top:12px"><button class="btn o" data-act="pegar">📋 Pegar lista</button>
   ${p.categorias.length > 1 ? `<button class="btn o" data-act="delCat">Quitar categoría</button>` : '<span></span>'}</div>
  <div class="fab"><button class="btn p" data-act="editJ">＋ Agregar jugador</button></div>` + nav('plantel');

function sheet(html) {
  closeSheet();
  const bg = document.createElement('div'); bg.className = 'sheet-bg'; bg.id = 'sheet';
  bg.innerHTML = `<div class="sheet">${html}</div>`;
  bg.addEventListener('click', e => { if (e.target === bg) closeSheet(); });
  document.body.appendChild(bg);
}
const closeSheet = () => { const s = document.getElementById('sheet'); if (s) s.remove(); };
function sheetJugador(id) {
  const j = P().jugadores.find(x => x.id === id) || { nombre: '', apoderado: '', tel: '', cat: ui.plCat };

function parsePegar(txt) {
  return txt.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const parts = l.split(/[,;\t|]/).map(s => s.trim()).filter(Boolean);
    let tel = ''; const resto = [];
    parts.forEach(s => { if (!tel && s.replace(/\D/g, '').length >= 8 && /^[+\d\s().-]+$/.test(s)) tel = s; else resto.push(s); });
    if (!tel) { const m = l.match(/(\+?\d[\d\s]{7,}\d)/); if (m) { tel = m[1]; if (resto.length) resto[resto.length - 1] = resto[resto.length - 1].replace(m[1], '').trim(); } }
    return { nombre: resto[0] || '', apoderado: resto[1] || '', tel };
  }).filter(x => x.nombre);
}

const SQL = `-- Citaciones Deportivo Liceo: pegar en Supabase > SQL Editor > Run
create table if not exists public.dl_registros (
  user_id uuid not null default auth.uid() references auth.users(id) on delete cascade,
  id text not null,
  tipo text not null,
  data jsonb not null default '{}'::jsonb,
  deleted boolean not null default false,
  updated_at timestamptz not null default now(),
  primary key (user_id, id)
);
alter table public.dl_registros enable row level security;
drop policy if exists dl_registros_propios on public.dl_registros;
create policy dl_registros_propios on public.dl_registros for all
  using (auth.uid() = user_id) with check (auth.uid() = user_id);

create table if not exists public.dl_respuestas (
  token text primary key,
  citacion_id text not null,
  user_id uuid not null default auth.uid() references auth.users(id) on delete cascade,
  jugador text not null,
  estado text not null default 'pendiente' check (estado in ('pendiente','si','no')),
  comentario text,
  respondido_at timestamptz
);
alter table public.dl_respuestas enable row level security;
drop policy if exists dl_respuestas_propias on public.dl_respuestas;
create policy dl_respuestas_propias on public.dl_respuestas for all
  using (auth.uid() = user_id) with check (auth.uid() = user_id);

-- El apoderado solo ve SU citación con su enlace (sin ver a otros jugadores)
create or replace function public.dl_ver_citacion(p_token text) returns jsonb
language sql security definer set search_path = public stable as $$
  select jsonb_build_object(
    'jugador', r.jugador, 'estado', r.estado, 'comentario', r.comentario,
    'citacion', c.data - 'convocados',
    'club', jsonb_build_object('escudo', cfg.data->'escudo', 'firma', cfg.data->'firma'))
  from dl_respuestas r
  join dl_registros c on c.user_id = r.user_id and c.id = r.citacion_id and not c.deleted
  left join dl_registros cfg on cfg.user_id = r.user_id and cfg.id = 'config'
  where r.token = p_token;
$$;

create or replace function public.dl_responder(p_token text, p_estado text, p_comentario text default null)
returns boolean language plpgsql security definer set search_path = public as $$
begin
  if p_estado not in ('si','no') then return false; end if;
  update dl_respuestas set estado = p_estado, comentario = left(p_comentario, 300), respondido_at = now()
  where token = p_token;
  return found;
end $$;

revoke all on function public.dl_ver_citacion(text) from public;
revoke all on function public.dl_responder(text, text, text) from public;
grant execute on function public.dl_ver_citacion(text) to anon, authenticated;
grant execute on function public.dl_responder(text, text, text) to anon, authenticated;`;

/* ---------- render y eventos ---------- */
function render() {
  if (qs.get('r')) return;
  const r = ruta(); let h = '';
  if (r.v === 'cit') h = vCit(r.id);
  else if (r.v === 'editar') h = vEditar(r.id);
  else if (r.v === 'plantel') h = vPlantel();
  else if (r.v === 'ajustes') h = vAjustes();
  else h = vInicio();
  if (r.v !== 'editar') draft = null;
  if (h) $app.innerHTML = `<div class="wrap">${h}</div>`;
}
let lastRoute = '';
window.addEventListener('hashchange', () => { const r = location.hash; render(); if (r !== lastRoute) window.scrollTo(0, 0); lastRoute = r; });

document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.f && draft) { draft[el.dataset.f] = el.value; if (el.dataset.f === 'cat') { draft.sel = P().jugadores.filter(j => el.value === '*' || j.cat === el.value).map(j => j.id); render(); } }
  if (el.dataset.cfg) { CFG()[el.dataset.cfg] = el.value; touch(R.config); }
  if (el.dataset.c) { C[el.dataset.c] = el.value.trim(); persist(); }
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.id === 'escFile' && el.files[0]) {
    const img = new Image(); img.src = URL.createObjectURL(el.files[0]); await img.decode();
    const s = 256, cv = document.createElement('canvas'); cv.width = cv.height = s;
    const k = Math.max(s / img.width, s / img.height), w = img.width * k, h = img.height * k;
    cv.getContext('2d').drawImage(img, (s - w) / 2, (s - h) / 2, w, h);
    CFG().escudo = cv.toDataURL('image/png'); touch(R.config); render(); toast('Escudo guardado ✓');
  }
  if (el.id === 'impFile' && el.files[0]) {
    try {
      const j = JSON.parse(await el.files[0].text());
      if (!j.registros) throw 0;
      if (!confirm('¿Restaurar este respaldo? Se reemplazan los datos de este teléfono.')) return;
      R = j.registros; Object.values(R).forEach(x => { x.dirty = true; x.updated_at = nowISO(); });
      persist(); schedSync(100); render(); toast('Respaldo restaurado ✓');
    } catch { toast('Ese archivo no es un respaldo válido.'); }
  }
});
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, r = ruta(), c = r.id ? R[r.id] : null;
  switch (a) {
    case 'close': closeSheet(); break;
    case 'tipo': draft.tipo = el.dataset.v; render(); break;
    case 'selJ': { const i = draft.sel.indexOf(el.dataset.id); i >= 0 ? draft.sel.splice(i, 1) : draft.sel.push(el.dataset.id); render(); break; }
    case 'selAll': draft.sel = P().jugadores.filter(j => draft.cat === '*' || j.cat === draft.cat).map(j => j.id); render(); break;
    case 'selNone': draft.sel = []; render(); break;
    case 'guardarCit': guardarCit(); break;
    case 'enviar': case 'enviar1': case 'recordar': {
      const v = findV(c, el.dataset.tk); if (!v) break;
      if (a === 'recordar') v.rec = true;
      if (!v.enviado) { v.enviado = true; v.enviadoAt = nowISO(); }
      touch(c); setTimeout(render, 400); break;
    }
    case 'ciclo': {
      const v = findV(c, el.dataset.tk); v.estado = { pendiente: 'si', si: 'no', no: 'pendiente' }[v.estado];
      v.t = nowISO(); v.mp = true; v.via = 'manual'; touch(c); render(); break;
    }
    case 'tab': ui.tab = el.dataset.v; render(); break;
    case 'actualizar': toast('Actualizando…', 1200); await sync(); toast(dotState === 'ok' ? 'Respuestas al día ✓' : 'No se pudo actualizar. Revisa la señal.'); break;
    case 'compartir': {
      const tx = listaTexto(c);
      try { if (navigator.share) await navigator.share({ text: tx }); else { await navigator.clipboard.writeText(tx); toast('Lista copiada ✓'); } }
      catch (err) { if (err && err.name !== 'AbortError') { try { await navigator.clipboard.writeText(tx); toast('Lista copiada ✓'); } catch { } } }
      break;
    }
    case 'duplicar': {
      draft = JSON.parse(JSON.stringify(c.data)); draft.sel = c.data.convocados.map(v => v.jid); draft.fecha = hoyISO(); draft._id = 'nuevo';
      go('#/editar'); toast('Copia lista: ajusta la fecha y guarda.'); break;
    }
    case 'borrarCit':
      if (confirm('¿Eliminar esta citación? Los enlaces enviados dejarán de funcionar.')) { c.deleted = true; touch(c); go('#/inicio'); toast('Citación eliminada'); }
      break;
    case 'plCat': ui.plCat = el.dataset.v; render(); break;
    case 'addCat': {
      const n = (prompt('Nombre de la nueva categoría (ej: Sub-11)') || '').trim();
      if (n && !P().categorias.includes(n)) { P().categorias.push(n); ui.plCat = n; touch(R.plantel); render(); }
      break;
    }
    case 'delCat': {
      const n = P().jugadores.filter(j => j.cat === ui.plCat).length;
      if (n) { toast(`Primero mueve o elimina a los ${n} jugadores de ${ui.plCat}.`); break; }
      if (confirm(`¿Quitar la categoría ${ui.plCat}?`)) { P().categorias = P().categorias.filter(x => x !== ui.plCat); ui.plCat = null; touch(R.plantel); render(); }
      break;
    }
    case 'editJ': sheetJugador(el.dataset.id); break;
    case 'saveJ': {
      const nombre = document.getElementById('jN').value.trim(); if (!nombre) return toast('Falta el nombre.');
      const datos = { nombre, apoderado: document.getElementById('jA').value.trim(), tel: document.getElementById('jT').value.trim(), cat: document.getElementById('jC').value };
      if (datos.tel && !telWA(datos.tel)) return toast('Revisa el número: ej. 9 1234 5678');
      const id = el.dataset.id;
      if (id) Object.assign(P().jugadores.find(x => x.id === id), datos); else P().jugadores.push({ id: uid(), ...datos });
      touch(R.plantel); closeSheet(); render(); toast(id ? 'Jugador actualizado ✓' : 'Jugador agregado ✓');
      if (!id) setTimeout(() => sheetJugador(), 250);
      break;
    }
    case 'delJ':
      if (confirm('¿Eliminar a este jugador del plantel?')) { P().jugadores = P().jugadores.filter(x => x.id !== el.dataset.id); touch(R.plantel); closeSheet(); render(); }
      break;
    case 'pegar': sheetPegar(); break;
    case 'savePegar': {
      const xs = parsePegar(document.getElementById('pg').value);
      if (!xs.length) return toast('No encontré jugadores en el texto.');
      xs.forEach(x => P().jugadores.push({ id: uid(), ...x, cat: ui.plCat }));
      touch(R.plantel); closeSheet(); render(); toast(`${xs.length} jugadores agregados ✓`); break;
    }
    case 'login': case 'signup': {
      if (!SB.ok()) return toast('Completa la URL y la clave del proyecto.');
      const em = document.getElementById('lgE').value.trim(), pw = document.getElementById('lgP').value;
      if (!em || pw.length < 6) return toast('Correo y contraseña (mínimo 6 caracteres).');
      el.classList.add('off');
      try { a === 'login' ? await SB.login(em, pw) : await SB.signup(em, pw); toast('Conectado ✓'); render(); await sync(); }
      catch (err) { toast(err.message, 4500); }
      el.classList.remove('off'); break;
    }
    case 'logout': if (confirm('¿Cerrar sesión? Los datos quedan en este teléfono.')) { C.session = null; C.tokOk = []; persist(); setDot('local'); render(); } break;
    case 'syncNow': await sync(); toast(dotState === 'ok' ? 'Sincronizado ✓' : 'No se pudo sincronizar.'); break;
    case 'verSQL':
      sheet(`<h3>SQL para Supabase</h3><p class="note">Supabase › SQL Editor › pegar › Run. Crea las tablas con seguridad por usuario (RLS).</p>
       <code class="sql">${esc(SQL)}</code><div style="margin-top:12px;display:grid;gap:10px"><button class="btn p" data-act="copiarSQL">Copiar SQL</button><button class="btn o" data-act="close">Cerrar</button></div>`);
      break;
    case 'copiarSQL': try { await navigator.clipboard.writeText(SQL); toast('SQL copiado ✓'); } catch { toast('No se pudo copiar'); } break;
    case 'exportar': {
      const blob = new Blob([JSON.stringify({ app: 'citaciones-dl', fecha: nowISO(), registros: R }, null, 1)], { type: 'application/json' });
      const u = URL.createObjectURL(blob), l = document.createElement('a');
      l.href = u; l.download = `respaldo-citaciones-${hoyISO()}.json`; document.body.appendChild(l); l.click(); l.remove();
      setTimeout(() => URL.revokeObjectURL(u), 2000); break;
    }
  }
});

/* ---------- página de respuesta (apoderados) ---------- */
async function initRespuesta(token) {
  const k = qs.get('k');
  if (k) { try { [RU, RK] = unb64u(k).split('|'); } catch { } }
  const shell = inner => { $app.innerHTML = `<div class="resp">${inner}</div>`; };
  const club = (esc0) => `<img class="badge" src="${esc0 || ESCUDO}" alt="Escudo"><div class="club">${CLUB}</div>`;
  shell(club() + '<p class="mut" style="margin-top:30px">Cargando citación…</p>');
  let d;
  try { if (!SB.ok()) throw new Error('cfg'); d = await SB.rpc('dl_ver_citacion', { p_token: token }); }
  catch { shell(club() + `<h1>Sin <em>conexión</em></h1><p class="mut">No pudimos cargar la citación. Revisa tu señal e inténtalo otra vez.</p><button class="btn p big2" onclick="location.reload()">Reintentar</button>`); return; }
  if (!d) { shell(club() + `<h1>Enlace <em>no disponible</em></h1><p class="mut">Esta citación ya no existe o el enlace no es válido. Consulta con el profe.</p>`); return; }
  const c = d.citacion || {}, esc0 = d.club && d.club.escudo;
  const info = (ic, lb, val) => val ? `<div class="info"><div class="ic">${ic}</div><div><small>${lb}</small><b>${val}</b></div></div>` : '';
  const detalle = `<div class="card" style="margin:14px 0">
    ${info('🏟️', c.tipo || 'Citación', esc(titulo(c)))}
    ${info('👥', 'Categoría', esc(c.cat))}
    ${info('📅', 'Fecha', cap(fmtFecha(c.fecha)))}
    ${info('⏰', 'Hora', c.hora ? esc(c.hora) + ' hrs' + (c.presentacion ? ' · presentarse ' + esc(c.presentacion) : '') : '')}
    ${info('📍', 'Lugar', esc(c.lugar))}
    ${info('📝', 'Notas', esc(c.notas))}
    ${c.mapa ? `<a class="btn o" style="margin-top:10px" href="${esc(c.mapa)}" target="_blank" rel="noopener">🗺️ Ver ubicación</a>` : ''}</div>`;
  const pintar = (estado, cambiar) => {
    if (estado === 'si' || estado === 'no') {
      if (!cambiar) return shell(club(esc0) + `<div class="done">${estado === 'si' ? '✅' : '👌'}</div>
        <h1>¡Gracias!</h1><p style="font-size:18px">Registramos que <b>${esc(d.jugador)}</b> ${estado === 'si' ? '<b class="c-si">asistirá</b>' : '<b class="c-no">no podrá asistir</b>'}.</p>
        ${detalle}<button class="btn o" id="cambiar">Cambiar respuesta</button>${d.club && d.club.firma ? `<p class="mut" style="margin-top:18px">${esc(d.club.firma)}</p>` : ''}`), document.getElementById('cambiar').onclick = () => pintar(estado, true);
    }
    shell(club(esc0) + `<h1>¿<em>${esc(d.jugador)}</em> asistirá?</h1>${detalle}
      <div style="display:grid;gap:12px"><button class="btn g big2" data-r="si">✅ Sí, asistirá</button><button class="btn d big2" data-r="no">❌ No podrá asistir</button></div>
      <label class="f" style="text-align:left"><span>Comentario (opcional)</span><input class="i" id="cm" maxlength="300" placeholder="Ej: llega 10 min tarde" value="${esc(d.comentario || '')}"></label>`);
    document.querySelectorAll('[data-r]').forEach(b => b.onclick = async () => {
      document.querySelectorAll('[data-r]').forEach(x => x.classList.add('off'));
      try {
        const ok = await SB.rpc('dl_responder', { p_token: token, p_estado: b.dataset.r, p_comentario: document.getElementById('cm').value.trim() || null });
        if (!ok) throw 0; d.estado = b.dataset.r; d.comentario = document.getElementById('cm').value.trim(); pintar(d.estado);
      } catch { toast('No se pudo enviar. Revisa tu señal e intenta otra vez.'); document.querySelectorAll('[data-r]').forEach(x => x.classList.remove('off')); }
    });
  };
  pintar(d.estado);
}
